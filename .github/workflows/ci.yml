name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:coverage
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build

  container:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t sanjaya .
      - run: docker run -d -p 8080:8080 --name sd sanjaya
      - run: |
          for i in $(seq 1 20); do curl -fs http://localhost:8080/healthz && break; sleep 1; done
      - run: node scripts/smoke.mjs http://localhost:8080
